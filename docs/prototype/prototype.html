<html lang="en" data-theme="ink">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oikome Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ===================== Themes ===================== */
:root { --ease: cubic-bezier(.4, 0, .2, 1); --cjk: system-ui; }
[data-theme="ink"] {
  --bg: #fcfcfb; --raised: #ffffff; --sunk: #f6f6f4;
  --ink: #141310; --ink2: rgba(20,19,16,.62); --ink3: rgba(20,19,16,.42);
  --line: rgba(20,19,16,.13); --line2: rgba(20,19,16,.07);
  --signal: #cc2b45; --accent: #141310; --on-accent: #fcfcfb;
  --hover: rgba(20,19,16,.035); --active: rgba(20,19,16,.06);
  --font: "IBM Plex Sans", var(--cjk), -apple-system, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --display: "IBM Plex Sans", var(--cjk), -apple-system, system-ui, sans-serif;
  --bw: 1px; --r-card: 8px; --r-btn: 6px; --r-pill: 4px; --r-chip: 999px;
  --sh-s: none; --sh-m: none; --sh-l: none;
  --t1: #141310; --t2: #141310; --t3: #141310; --t4: #141310; --t5: #141310;
  --tile-bg: transparent;
  --dot: rgba(20,19,16,.05); --track: rgba(20,19,16,.08); --scrim: rgba(20,19,16,.28); --pop: 0 24px 64px rgba(20,19,16,.12); --pop-s: 0 12px 32px rgba(20,19,16,.12); --knob: #fff;
}
[data-theme="bold"] {
  --bg: #fdf9f0; --raised: #ffffff; --sunk: #fff6e5;
  --ink: #111111; --ink2: #3a3a3a; --ink3: #6b6b6b;
  --line: #111111; --line2: #111111;
  --signal: #ff6b5e; --accent: #ff3d81; --on-accent: #111111;
  --hover: #fff1d6; --active: #ffe7b8;
  --font: "Space Grotesk", var(--cjk), system-ui, sans-serif;
  --mono: "Space Mono", ui-monospace, monospace;
  --display: "Archivo Black", "Space Grotesk", var(--cjk), sans-serif;
  --bw: 2px; --r-card: 18px; --r-btn: 8px; --r-pill: 999px; --r-chip: 999px;
  --sh-s: 4px 4px 0 0 var(--edge); --sh-m: 6px 6px 0 0 var(--edge); --sh-l: 9px 9px 0 0 var(--edge);
  --t1: #ff3d81; --t2: #3ddc97; --t3: #ffd23f; --t4: #c8a2ff; --t5: #ff6b5e;
  --edge: #111; --paper: #fff; --grid: rgba(17,17,17,.05); --scrim: rgba(17,17,17,.35); --off: #eee; --bad-row: #ffe1dd; --knob: #fff;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 400 14px/20px var(--font);
  -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  transition: background-color .25s var(--ease), color .25s var(--ease);
}
[data-theme="bold"] body {
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-weight: 500;
}
button, input { font: inherit; color: inherit; }
svg { display: block; }
a { color: inherit; text-decoration: none; }
.mono { font-family: var(--mono); }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }

/* ===================== Shell ===================== */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background: var(--raised); border-right: var(--bw) solid var(--line); padding: 16px 12px;
}
.ws { display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px; }
.ws__mark { width: 28px; height: 28px; display: grid; place-items: center; background: var(--ink); color: var(--raised); border-radius: var(--r-btn); }
[data-theme="bold"] .ws__mark { background: var(--t1); color: #111; border: 2px solid var(--edge); box-shadow: var(--sh-s); }
.ws__mark svg { width: 18px; height: 18px; }
.ws__name { font: 600 15px/20px var(--font); }
[data-theme="bold"] .ws__name { font: 400 15px/20px var(--display); text-transform: uppercase; letter-spacing: -.01em; }
.ws__sub { font: 400 12px/16px var(--mono); color: var(--ink3); }
.search {
  display: flex; align-items: center; gap: 8px; margin: 0 4px 14px; height: 34px; padding: 0 10px;
  border: var(--bw) solid var(--line); border-radius: var(--r-btn); color: var(--ink3); cursor: pointer;
  background: var(--bg); transition: border-color .15s var(--ease);
}
[data-theme="bold"] .search { border-radius: 999px; box-shadow: var(--sh-s); background: var(--paper); }
.search:hover { border-color: var(--ink2); }
.search kbd { margin-left: auto; font: 500 11px/1 var(--mono); padding: 3px 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--ink3); }
.nav { display: grid; gap: 2px; }
.nav a {
  position: relative; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px;
  border-radius: var(--r-btn); color: var(--ink2); transition: background-color .15s var(--ease), color .15s var(--ease);
}
.nav a svg { width: 17px; height: 17px; }
.nav a:hover { background: var(--hover); color: var(--ink); }
.nav a.on { color: var(--ink); font-weight: 600; background: var(--active); }
[data-theme="ink"] .nav a.on::before { content: ""; position: absolute; left: -12px; top: 6px; bottom: 6px; width: 3px; background: var(--ink); }
[data-theme="bold"] .nav a { height: 38px; border-radius: 999px; border: 2px solid transparent; font-weight: 600; color: var(--ink); }
[data-theme="bold"] .nav a.on { background: var(--t1); border-color: var(--edge); box-shadow: var(--sh-s); }
.nav__count { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--ink3); }
[data-theme="bold"] .nav__count { padding: 3px 7px; border: 2px solid var(--edge); border-radius: 999px; background: var(--t3); color: #111; }
.nav-group { margin: 18px 10px 6px; }
.side__foot { margin-top: auto; display: grid; gap: 10px; }
.meter-card { padding: 12px; border: var(--bw) solid var(--line); border-radius: var(--r-card); background: var(--bg); }
[data-theme="bold"] .meter-card { background: var(--paper); box-shadow: var(--sh-s); border-radius: 14px; }
.meter-card__row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; }
.bar { height: 4px; background: var(--line2); border-radius: 2px; overflow: hidden; }
[data-theme="ink"] .bar { background: var(--track); }
[data-theme="bold"] .bar { height: 10px; border: 2px solid var(--edge); border-radius: 999px; background: var(--paper); }
.bar > i { display: block; height: 100%; background: var(--ink); transform-origin: left; animation: grow .9s var(--ease) both; }
[data-theme="bold"] .bar > i { background: var(--t2); border-right: 2px solid var(--edge); }
@keyframes grow { from { transform: scaleX(0); } }
.me { display: flex; align-items: center; gap: 10px; padding: 6px 8px; }
.me__name { font-weight: 600; }

.main { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; height: 56px; padding: 0 32px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: var(--bw) solid var(--line);
}
[data-theme="bold"] .top { background: color-mix(in srgb, var(--bg) 92%, transparent); }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumb span { white-space: nowrap; }
.crumb .sep { color: var(--ink3); }
.crumb .here { font-weight: 600; }
.top__actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.page { padding: 28px 32px 64px; max-width: 1240px; animation: rise .28s var(--ease) both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
.head h1 { margin: 0; font: 600 26px/32px var(--display); letter-spacing: -.02em; }
[data-theme="bold"] .head h1 { font: 400 34px/38px var(--display); text-transform: uppercase; letter-spacing: -.02em; }
.head p { margin: 4px 0 0; color: var(--ink2); }

/* ===================== Primitives ===================== */
.label { font: 600 10.5px/14px var(--font); letter-spacing: .08em; text-transform: uppercase; color: var(--ink3); }
[data-theme="bold"] .label { font: 400 12px/16px var(--display); letter-spacing: .02em; color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 12px;
  border: var(--bw) solid var(--line); border-radius: var(--r-btn); background: var(--raised); color: var(--ink);
  font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: transform .1s var(--ease), box-shadow .1s var(--ease), background-color .15s var(--ease), border-color .15s var(--ease);
}
.btn svg { width: 15px; height: 15px; }
.btn:hover { border-color: var(--ink2); }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn--primary:hover { border-color: var(--accent); filter: brightness(1.15); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.btn--ghost:hover { background: var(--hover); color: var(--ink); border-color: transparent; }
.btn--danger { color: var(--signal); }
[data-theme="bold"] .btn { height: 36px; padding: 0 14px; font-weight: 700; box-shadow: var(--sh-s); }
[data-theme="bold"] .btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 0 var(--edge); border-color: var(--edge); filter: none; }
[data-theme="bold"] .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0 0 var(--edge); }
[data-theme="bold"] .btn--ghost { box-shadow: none; border-color: transparent; }
[data-theme="bold"] .btn--ghost:hover { box-shadow: none; transform: none; background: var(--hover); }
.icon-btn { width: 32px; padding: 0 !important; }
[data-theme="bold"] .icon-btn { width: 36px; }

.card { background: var(--raised); border: var(--bw) solid var(--line); border-radius: var(--r-card); }
[data-theme="bold"] .card { box-shadow: var(--sh-m); transition: transform .15s var(--ease), box-shadow .15s var(--ease); }
[data-theme="bold"] .card.lift:hover { transform: translate(-2px, -2px); box-shadow: var(--sh-l); }
.card__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: var(--bw) solid var(--line2); }
[data-theme="bold"] .card__head { border-bottom: 2px solid var(--edge); }
.card__body { padding: 16px; }
.link { color: var(--ink); font-weight: 500; border-bottom: 1px solid var(--line); transition: border-color .15s var(--ease); }
.link:hover { border-color: var(--ink); }
[data-theme="bold"] .link { border: 0; color: var(--t1); font-weight: 700; }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border: 1px solid var(--line); border-radius: var(--r-pill); font: 500 11px/1 var(--mono); color: var(--ink2); white-space: nowrap; }
[data-theme="bold"] .tag { height: 22px; padding: 0 9px; border: 2px solid var(--edge); border-radius: 999px; font: 700 11px/1 var(--font); color: #111; background: var(--t3); }
.tag--accent { color: var(--signal); border-color: color-mix(in srgb, var(--signal) 40%, transparent); }
[data-theme="bold"] .tag--accent { background: var(--t5); color: #111; border-color: var(--edge); }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r-chip); font: 400 12px/1 var(--mono); }
[data-theme="bold"] .chip { border: 2px solid var(--edge); background: var(--paper); font-weight: 700; }

/* Ink status glyphs; colored pills in Bold */
.st { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.st i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
[data-theme="ink"] .st--ok i { background: var(--ink); }
[data-theme="ink"] .st--run i { border: 1.5px solid var(--ink); background: linear-gradient(90deg, transparent 50%, var(--ink) 50%); animation: spin 2.4s linear infinite; }
[data-theme="ink"] .st--idle i { border: 1.5px solid var(--ink); }
[data-theme="ink"] .st--off i { border: 1.5px dashed var(--ink3); }
[data-theme="ink"] .st--bad i { background: var(--signal); }
[data-theme="ink"] .st--bad { color: var(--signal); }
[data-theme="bold"] .st { padding: 3px 10px 3px 6px; border: 2px solid var(--edge); border-radius: 999px; font: 700 12px/16px var(--font); box-shadow: 2px 2px 0 var(--edge); background: var(--paper); }
[data-theme="bold"] .st i { width: 10px; height: 10px; border: 2px solid var(--edge); }
[data-theme="bold"] .st--ok { background: var(--t2); } [data-theme="bold"] .st--ok i { background: #fff; }
[data-theme="bold"] .st--run { background: var(--t4); } [data-theme="bold"] .st--run i { background: #fff; animation: pulse 1.2s ease-in-out infinite; }
[data-theme="bold"] .st--idle { background: var(--paper); } [data-theme="bold"] .st--idle i { background: var(--t3); }
[data-theme="bold"] .st--off { background: var(--off); } [data-theme="bold"] .st--off i { background: #bbb; }
[data-theme="bold"] .st--bad { background: var(--t5); } [data-theme="bold"] .st--bad i { background: #fff; }
.st--plain { padding: 0 !important; border: 0 !important; box-shadow: none !important; background: none !important; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { transform: scale(.6); } }

.av { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font: 600 11px/1 var(--font); border: 1px solid var(--line); background: var(--raised); }
[data-theme="bold"] .av { border: 2px solid var(--edge); font-weight: 700; }
[data-theme="bold"] .av--a { background: var(--t4); } [data-theme="bold"] .av--b { background: var(--t2); } [data-theme="bold"] .av--c { background: var(--t3); } [data-theme="bold"] .av--d { background: var(--t1); }
.stack { display: inline-flex; } .stack .av + .av { margin-left: -6px; }

.ico { width: 34px; height: 34px; display: grid; place-items: center; flex: none; border: var(--bw) solid var(--line); border-radius: var(--r-btn); background: var(--raised); }
.ico svg { width: 17px; height: 17px; }
[data-theme="bold"] .ico { border-radius: 10px; box-shadow: 2px 2px 0 var(--edge); }
[data-theme="bold"] .ico.c1 { background: var(--t1); } [data-theme="bold"] .ico.c2 { background: var(--t2); } [data-theme="bold"] .ico.c3 { background: var(--t3); } [data-theme="bold"] .ico.c4 { background: var(--t4); } [data-theme="bold"] .ico.c5 { background: var(--t5); }

.toggle { position: relative; width: 34px; height: 20px; border-radius: 999px; background: var(--line); cursor: pointer; flex: none; transition: background-color .2s var(--ease); }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--knob); transition: transform .2s var(--ease); }
.toggle.on { background: var(--ink); }
.toggle.on::after { transform: translateX(14px); }
[data-theme="bold"] .toggle { width: 40px; height: 24px; border: 2px solid var(--edge); background: var(--paper); }
[data-theme="bold"] .toggle::after { top: 2px; left: 2px; width: 16px; height: 16px; border: 2px solid var(--edge); background: #fff; }
[data-theme="bold"] .toggle.on { background: var(--t2); }
[data-theme="bold"] .toggle.on::after { transform: translateX(16px); }

.seg { display: inline-flex; border: var(--bw) solid var(--line); border-radius: var(--r-btn); overflow: hidden; }
.seg button { height: 30px; padding: 0 12px; border: 0; background: var(--raised); color: var(--ink2); cursor: pointer; transition: background-color .15s var(--ease), color .15s var(--ease); }
.seg button + button { border-left: var(--bw) solid var(--line); }
.seg button.on { background: var(--ink); color: var(--raised); }
[data-theme="bold"] .seg { border-radius: 999px; box-shadow: var(--sh-s); }
[data-theme="bold"] .seg button { font-weight: 700; color: var(--ink); }
[data-theme="bold"] .seg button.on { background: var(--t3); color: #111; }

/* ===================== Tables ===================== */
.table { width: 100%; border-collapse: collapse; }
.table th { text-align: left; padding: 10px 16px; border-bottom: var(--bw) solid var(--line); background: var(--raised); }
.table td { padding: 0 16px; height: 46px; border-bottom: 1px solid var(--line2); white-space: nowrap; }
[data-theme="bold"] .table td { border-bottom: 2px solid var(--edge); height: 50px; }
.table tr:last-child td { border-bottom: 0; }
.table tbody tr { transition: background-color .12s var(--ease); }
.table tbody tr:hover { background: var(--hover); }
.table .num { text-align: right; }
.table .bad td { color: var(--signal); }
[data-theme="bold"] .table .bad td { color: var(--ink); background: var(--bad-row); }
.wrap { overflow-x: auto; }
/* Collections and folders as in a file manager. */
.cols-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -8px 0 22px; }
.cols-table tbody tr { cursor: pointer; }
.cols-table .cols-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.ico--s { width: 28px; height: 28px; }
.sorth { display: inline-flex; gap: 4px; align-items: center; padding: 0; border: 0; background: none; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.sorth.on { color: var(--ink); }
.num .sorth { justify-content: flex-end; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.ftile { display: grid; gap: 6px; padding: 0; border: 0; background: none; text-align: left; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.ftile__art { aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; border: var(--bw) solid var(--line); border-radius: var(--r-btn); background: var(--raised); }
.ftile__art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ftile__art--ico svg { width: 40px; height: 40px; color: var(--ink2); }
.ftile:hover .ftile__art { border-color: var(--ink); }
.ftile__name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ftile__meta { font: 400 12px/16px var(--mono); color: var(--ink3); }

/* ===================== Covers ===================== */
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.cover { display: grid; gap: 10px; cursor: pointer; }
.cover__art { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: var(--raised); border: var(--bw) solid var(--line); border-radius: var(--r-card); transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s var(--ease); }
.cover:hover .cover__art { border-color: var(--ink2); }
[data-theme="ink"] .cover:hover .cover__art { transform: translateY(-2px); }
[data-theme="bold"] .cover__art { box-shadow: var(--sh-m); }
[data-theme="bold"] .cover:hover .cover__art { transform: translate(-2px, -2px); box-shadow: var(--sh-l); border-color: var(--edge); }
.cover__art img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s var(--ease); }
.cover:hover .cover__art img { transform: scale(1.03); }
[data-theme="ink"] .cover__art img { filter: grayscale(1) contrast(1.05); transition: transform .6s var(--ease), filter .5s var(--ease); }
[data-theme="ink"] .cover:hover .cover__art img { filter: grayscale(0); }
.collage { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; height: 100%; }
.collage img:first-child { grid-row: span 2; }
.collage--1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.collage--2 { grid-template-rows: 1fr; grid-template-columns: 1fr 1fr; }
.collage--2 img:first-child { grid-row: auto; }
/* A folder inside a folder: a cover like a collection's, as a button. */
button.cover { width: 100%; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; }
.fsubs { margin-bottom: 28px; }
.ftile__art--paper { place-items: start; padding: 10px 12px; text-align: left; }
.ftile__art--paper span { font-size: 12px; line-height: 17px; color: var(--ink2); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
.ftile__art--rows { place-items: start stretch; padding: 8px 10px; }
[data-theme="bold"] .collage { gap: 0; } [data-theme="bold"] .collage img + img { border-left: 2px solid var(--edge); } [data-theme="bold"] .collage img:last-child { border-top: 2px solid var(--edge); }
.paper { height: 100%; padding: 16px 18px 44px; display: flex; flex-direction: column; gap: 8px; }
[data-theme="ink"] .paper { background-image: radial-gradient(var(--dot) .6px, transparent .6px); background-size: 4px 4px; }
[data-theme="bold"] .paper { background: var(--t3); }
.paper q { quotes: none; font: 400 15px/22px var(--font); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.paper .more { margin-top: auto; }
.minitable { width: 100%; border-collapse: collapse; font: 400 12px/16px var(--mono); }
.minitable td, .minitable th { padding: 6px 4px; border-bottom: 1px solid var(--line2); text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0; }
.minitable th { color: var(--ink3); font-weight: 500; }
[data-theme="bold"] .minitable td, [data-theme="bold"] .minitable th { border-bottom: 2px solid var(--edge); }
[data-theme="bold"] .art--table { background: var(--t2); }
.spark { display: flex; align-items: flex-end; gap: 3px; height: 100%; padding: 18px 18px 14px; }
.spark i { flex: 1; background: var(--ink); border-radius: 1px; animation: grow-y .8s var(--ease) both; transform-origin: bottom; }
[data-theme="bold"] .spark { background: var(--t4); }
[data-theme="bold"] .spark i { background: #fff; border: 2px solid var(--edge); border-radius: 4px 4px 0 0; }
@keyframes grow-y { from { transform: scaleY(0); } }
.cover__cap { display: grid; gap: 2px; }
.cover__line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.cover__name { font: 500 14px/20px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-theme="bold"] .cover__name { font: 700 15px/20px var(--font); }
.cover__line .stack { margin-left: auto; }
.cover__meta { font: 400 12px/16px var(--mono); color: var(--ink3); }
.src-glyph { position: absolute; left: 10px; bottom: 10px; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-pill); font: 500 11px/1 var(--mono); }
[data-theme="bold"] .src-glyph { border: 2px solid var(--edge); border-radius: 999px; font: 700 11px/1 var(--font); box-shadow: 2px 2px 0 var(--edge); }

/* ===================== Home ===================== */
.hero { position: relative; padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; }
[data-theme="ink"] .hero { background-image: radial-gradient(var(--dot) .6px, transparent .6px); background-size: 4px 4px; }
.hero__title { font: 500 20px/26px var(--font); margin: 6px 0 4px; }
[data-theme="bold"] .hero__title { font: 400 24px/28px var(--display); text-transform: uppercase; }
.pipe { display: grid; grid-template-columns: repeat(4, 92px); position: relative; }
.pipe::before { content: ""; position: absolute; left: 46px; right: 46px; top: 5px; height: 1px; background: var(--line); }
[data-theme="bold"] .pipe::before { height: 3px; top: 5px; background: #111; }
.pipe div { position: relative; display: grid; justify-items: center; gap: 4px; text-align: center; }
.pipe div i { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); }
[data-theme="bold"] .pipe div i { width: 14px; height: 14px; border: 2px solid var(--edge); background: var(--t2); margin-top: -1px; }
.pipe div i.half { background: linear-gradient(90deg, var(--raised) 50%, var(--ink) 50%); border: 1.5px solid var(--ink); }
[data-theme="bold"] .pipe div i.half { background: var(--t3); }
.pipe b { font: 600 10.5px/14px var(--font); letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
[data-theme="bold"] .pipe b { font: 400 11px/14px var(--display); }
.kpi { padding: 16px; display: grid; gap: 4px; }
.kpi__top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.kpi__value { font: 500 26px/30px var(--mono); letter-spacing: -.02em; }
[data-theme="bold"] .kpi__value { font: 400 30px/34px var(--display); }
.delta { font: 500 11px/1 var(--mono); color: var(--ink2); }
[data-theme="bold"] .delta { padding: 3px 7px; border: 2px solid var(--edge); border-radius: 999px; background: var(--t2); color: #111; font-weight: 700; }
.dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.dash--start { align-items: start; }
.w4 { grid-column: span 4; } .w5 { grid-column: span 5; } .w6 { grid-column: span 6; } .w7 { grid-column: span 7; } .w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
.widget { position: relative; }
.widget__by { font: 400 11px/14px var(--mono); color: var(--ink3); }
.edit .widget { outline: 1px dashed var(--ink3); outline-offset: 4px; cursor: grab; animation: jiggle .3s var(--ease); }
.edit .widget::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 10px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); }
@keyframes jiggle { 50% { transform: scale(.995); } }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid var(--line2); transition: background-color .12s var(--ease); }
[data-theme="bold"] .li { border-bottom: 2px solid var(--edge); }
.li:last-child { border-bottom: 0; }
.li:hover { background: var(--hover); }
.li__main { flex: 1; min-width: 0; display: grid; gap: 1px; }
.li__title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li__meta { font: 400 12px/16px var(--mono); color: var(--ink3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding: 0 4px; border-bottom: 1px solid var(--line); }
.chart i { flex: 1; background: var(--ink); min-height: 2px; transform-origin: bottom; animation: grow-y .7s var(--ease) both; }
[data-theme="ink"] .chart i { max-width: 6px; margin: 0 auto; }
[data-theme="bold"] .chart { border-bottom: 2px solid var(--edge); gap: 8px; }
[data-theme="bold"] .chart i { background: var(--t1); border: 2px solid var(--edge); border-bottom: 0; border-radius: 6px 6px 0 0; }
[data-theme="bold"] .chart i:nth-child(3n) { background: var(--t4); } [data-theme="bold"] .chart i:nth-child(4n) { background: var(--t2); }
.temps { display: grid; grid-template-columns: repeat(3, 1fr); }
.temps div { padding: 14px 16px; border-right: 1px solid var(--line2); display: grid; gap: 2px; }
[data-theme="bold"] .temps div { border-right: 2px solid var(--edge); }
.temps div:last-child { border-right: 0; }
.temps b { font: 500 24px/28px var(--mono); }
[data-theme="bold"] .temps b { font: 400 26px/30px var(--display); }
.memory { position: relative; height: 100%; min-height: 220px; overflow: hidden; border-radius: inherit; }
.memory img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: kenburns 14s ease-in-out infinite alternate; }
@keyframes kenburns { to { transform: scale(1.08) translate(-1%, -1%); } }
.memory__cap { position: absolute; left: 12px; bottom: 12px; right: 12px; padding: 10px 12px; background: var(--raised); border: var(--bw) solid var(--line); border-radius: var(--r-btn); }
[data-theme="bold"] .memory__cap { box-shadow: var(--sh-s); border-radius: 12px; }

/* ===================== Collection page ===================== */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 20px; }
.facts div { padding: 12px 16px; border-right: 1px solid var(--line2); display: grid; gap: 3px; }
[data-theme="bold"] .facts div { border-right: 2px solid var(--edge); }
.facts div:last-child { border-right: 0; }
.facts .v { font: 400 13px/18px var(--mono); }
[data-theme="bold"] .facts .v { font: 700 14px/18px var(--font); }
.masonry { columns: 3 240px; column-gap: 16px; }
.photo { break-inside: avoid; margin: 0 0 16px; }
.photo img { width: 100%; display: block; border: var(--bw) solid var(--line); border-radius: var(--r-card); transition: transform .3s var(--ease); }
[data-theme="ink"] .photo img { filter: grayscale(1); transition: filter .5s var(--ease); }
[data-theme="ink"] .photo:hover img { filter: grayscale(0); }
[data-theme="bold"] .photo img { box-shadow: var(--sh-m); }
.photo figcaption { display: flex; justify-content: space-between; gap: 8px; padding: 8px 2px 0; font-size: 13px; }
.photo figcaption span:last-child { font: 400 11px/16px var(--mono); color: var(--ink3); }

/* ===================== Sources ===================== */
.src { display: grid; grid-template-columns: 34px minmax(0, 1.4fr) 1fr 1fr 1fr auto; align-items: center; gap: 16px; padding: 14px 16px; border-bottom: 1px solid var(--line2); transition: background-color .12s var(--ease); }
[data-theme="bold"] .src { border-bottom: 2px solid var(--edge); }
.src:last-child { border-bottom: 0; }
.src:hover { background: var(--hover); }
.src.bad .why { color: var(--signal); }
.catalog { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.app-tile { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; }

/* ===================== Dialogs & overlays ===================== */
.scrim { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--scrim); animation: fade .18s var(--ease) both; }
[data-theme="bold"] .scrim { background: var(--scrim); }
@keyframes fade { from { opacity: 0; } }
.dialog { width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 64px); overflow: auto; background: var(--raised); border: var(--bw) solid var(--line); border-radius: calc(var(--r-card) + 2px); animation: pop .22s var(--ease) both; }
[data-theme="ink"] .dialog { box-shadow: var(--pop); }
[data-theme="bold"] .dialog { box-shadow: var(--sh-l); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.985); } }
.dialog__head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: var(--bw) solid var(--line2); }
[data-theme="bold"] .dialog__head { border-bottom: 2px solid var(--edge); }
.dialog__head h2 { margin: 0; font: 600 17px/22px var(--display); }
[data-theme="bold"] .dialog__head h2 { font: 400 18px/22px var(--display); text-transform: uppercase; }
.dialog__body { padding: 20px; display: grid; gap: 18px; }
.dialog__foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 14px 20px; border-top: var(--bw) solid var(--line2); }
[data-theme="bold"] .dialog__foot { border-top: 2px solid var(--edge); }
@media (min-width: 721px) {
  .scrim:has(.dialog--top) { place-items: start center; }
  .dialog--top { display: flex; flex-direction: column; max-height: calc(100vh - 96px); margin-top: 64px; overflow: hidden; }
  .dialog--top .dialog__head, .dialog--top .dialog__foot { flex: none; }
  .dialog--top .dialog__body { min-height: 0; overflow-y: auto; }
}
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.steps div { display: grid; gap: 6px; }
.steps div i { height: 3px; background: var(--line); border-radius: 2px; transition: background-color .3s var(--ease); }
.steps div.on i { background: var(--ink); }
[data-theme="bold"] .steps div i { height: 8px; border: 2px solid var(--edge); background: var(--paper); }
[data-theme="bold"] .steps div.on i { background: var(--t1); }
.opts { display: grid; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: var(--bw) solid var(--line); border-radius: var(--r-btn); cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
.opt:hover { border-color: var(--ink2); }
.opt.on { border-color: var(--ink); background: var(--hover); }
[data-theme="ink"] .opt.on { box-shadow: inset 0 0 0 1px var(--ink); }
[data-theme="bold"] .opt { border-radius: 12px; }
[data-theme="bold"] .opt.on { background: var(--t3); box-shadow: var(--sh-s); }
.radio { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--ink2); flex: none; display: grid; place-items: center; }
.opt.on .radio { border-color: var(--ink); }
.opt.on .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
[data-theme="bold"] .radio { border: 2px solid var(--edge); background: var(--paper); }
.cols { display: flex; flex-wrap: wrap; gap: 6px; }
.cols .chip { cursor: pointer; }
.cols .chip.off { opacity: .45; text-decoration: line-through; }
.field { display: grid; gap: 6px; }
.input { height: 36px; padding: 0 12px; border: var(--bw) solid var(--line); border-radius: var(--r-btn); background: var(--raised); display: flex; align-items: center; gap: 8px; }
[data-theme="bold"] .input { height: 40px; border-radius: 10px; box-shadow: var(--sh-s); }
.code { padding: 12px 14px; background: var(--sunk); border: var(--bw) solid var(--line2); border-radius: var(--r-btn); font: 400 12px/18px var(--mono); white-space: pre; overflow-x: auto; }
[data-theme="bold"] .code { background: #111; color: #fdf9f0; border: 2px solid var(--edge); border-radius: 12px; }
.cmdk { width: min(680px, calc(100vw - 32px)); align-self: start; margin-top: 12vh; }
.cmdk__input { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: var(--bw) solid var(--line2); font-size: 16px; }
[data-theme="bold"] .cmdk__input { border-bottom: 2px solid var(--edge); }
.cmdk__input span.caret { width: 1px; height: 18px; background: var(--ink); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cmdk__group { padding: 8px 8px 4px; }
.cmdk__group .label { padding: 6px 10px; }
.hit { display: flex; gap: 12px; align-items: center; padding: 9px 10px; border-radius: var(--r-btn); cursor: pointer; }
.hit:hover, .hit.on { background: var(--hover); }
[data-theme="bold"] .hit.on { background: var(--t3); outline: 2px solid var(--edge); }
.hit mark { background: none; color: inherit; border-bottom: 1.5px solid var(--signal); }
[data-theme="bold"] .hit mark { background: var(--t1); border: 0; padding: 0 2px; }
.hit img { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; }
.qr { width: 132px; height: 132px; display: grid; grid-template-columns: repeat(21, 1fr); padding: 8px; border: var(--bw) solid var(--line); border-radius: var(--r-btn); background: #fff; }
.qr i { background: #141310; }
.qr i.o { background: transparent; }

/* ===================== Assistant chat ===================== */
.chat { display: grid; gap: 14px; padding: 16px; }
.bubble { max-width: 78%; padding: 10px 14px; border: var(--bw) solid var(--line); border-radius: var(--r-card); }
.bubble--me { justify-self: end; background: var(--ink); color: var(--raised); border-color: var(--ink); }
[data-theme="bold"] .bubble { box-shadow: var(--sh-s); border-radius: 16px; }
[data-theme="bold"] .bubble--me { background: var(--t4); color: #111; border-color: var(--edge); }
.cite { display: inline-flex; align-items: center; gap: 4px; margin: 6px 6px 0 0; padding: 2px 7px; border: 1px solid var(--line); border-radius: var(--r-pill); font: 400 11px/16px var(--mono); }
[data-theme="bold"] .cite { border: 2px solid var(--edge); border-radius: 999px; background: var(--t2); font-weight: 700; }

/* ===================== Welcome ===================== */
.welcome { display: grid; place-items: center; min-height: 100vh; padding: 40px 16px; }
.welcome__card { width: min(520px, 100%); padding: 32px; }
.welcome__card h1 { margin: 18px 0 6px; font: 600 26px/32px var(--display); letter-spacing: -.02em; }
[data-theme="bold"] .welcome__card h1 { font: 400 32px/36px var(--display); text-transform: uppercase; }

/* ===================== Round 2: what every control opens ===================== */
[data-go] { cursor: pointer; }
.still, .still .chart i, .still .spark i, .still .bar > i, .still .welcome__card, .scrim.still, .scrim.still .dialog { animation: none !important; }
.head__acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.notice { display: flex; align-items: center; gap: 14px; padding: 14px 16px; margin-bottom: 16px; }
.card__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line2); }
[data-theme="bold"] .card__foot { border-top: 2px solid var(--edge); }
.pipe div i.off { background: var(--raised); border: 1.5px dashed var(--ink3); }
.addcard { display: grid; place-items: center; align-content: center; gap: 8px; min-height: 140px; border-style: dashed; color: var(--ink2); cursor: pointer; background: transparent; font-weight: 500; }
.addcard svg { width: 20px; height: 20px; }
.dialog--s { width: min(460px, calc(100vw - 32px)); }
.dialog--l { width: min(780px, calc(100vw - 32px)); }
.btn--stop { background: var(--signal); border-color: var(--signal); color: #fff; }
.btn--stop:hover { border-color: var(--signal); filter: brightness(1.08); }
[data-theme="bold"] .btn--stop { color: #111; border-color: var(--edge); }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none !important; box-shadow: none !important; filter: none !important; }
.spin svg { animation: spin .9s linear infinite; }
.err { color: var(--signal); font-size: 13px; line-height: 18px; }
.hint { color: var(--ink3); font-size: 12px; line-height: 16px; }
.input input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; }
.input:focus-within { border-color: var(--ink); }
.check { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--ink2); flex: none; display: grid; place-items: center; background: var(--raised); }
.opt.on .check { background: var(--ink); border-color: var(--ink); }
.opt.on .check::after { content: ""; width: 8px; height: 4px; margin-top: -2px; border-left: 2px solid var(--raised); border-bottom: 2px solid var(--raised); transform: rotate(-45deg); }
[data-theme="bold"] .check { border: 2px solid var(--edge); border-radius: 6px; }
[data-theme="bold"] .opt.on .check { background: var(--t2); border-color: var(--edge); }
[data-theme="bold"] .opt.on .check::after { border-color: var(--edge); }
.opts--grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opts--tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
/* Google Drive through the owner's own app: register it, then give it to Oikome. */
.gapp { display: grid; gap: 8px; padding: 14px; border: var(--bw) solid var(--line2); border-radius: var(--r-btn); }
.gapp__t { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 14px; font-weight: 600; }
.gapp__n { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: var(--raised); font-size: 12px; font-weight: 600; flex: none; }
.gapp ol { margin: 0; padding-left: 20px; }
.gapp ol a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.gapp__or { display: flex; align-items: center; gap: 12px; color: var(--ink3); font-size: 12px; }
.gapp__or::after { content: ""; flex: 1; height: 1px; background: var(--line2); }
/* A folder viewed where it is: named with a folder before it, in the text face. */
.cover__name--folder { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font); font-weight: 600; }
.cover__name--folder svg { flex: none; color: var(--ink3); }
/* On the first run, another place is added beside the places. */
.wadd { display: flex; align-items: center; gap: 12px; width: 100%; margin: -8px 0 22px; padding: 10px 14px; border: var(--bw) dashed var(--line); border-radius: var(--r-btn); background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; transition: border-color .15s var(--ease), background-color .15s var(--ease); }
.wadd:hover { border-style: solid; border-color: var(--ink3); background: var(--raised); }
.wadd__ico { display: grid; place-items: center; flex: none; width: 30px; height: 30px; border-radius: 8px; background: var(--sunk); color: var(--ink2); }
.wadd__text { display: grid; gap: 2px; min-width: 0; }
.wadd__text b { font-size: 14px; font-weight: 600; }
.wadd__text span { font-size: 12px; line-height: 16px; color: var(--ink3); }
[data-theme="bold"] .wadd { border-width: 2px; border-color: var(--edge); border-radius: 12px; }
.wadded { display: grid; gap: 6px; margin: -8px 0 14px; }
.wadded__row { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 8px 12px; border: var(--bw) solid var(--line2); border-radius: var(--r-btn); }
.wadded__row b { font-size: 14px; font-weight: 600; }
.wadded__row .mono { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.wadded__row .ico { width: 26px; height: 26px; }
.box { padding: 12px 14px; border: var(--bw) solid var(--line2); border-radius: var(--r-btn); background: var(--sunk); display: grid; gap: 6px; }
[data-theme="bold"] .box { border: 2px solid var(--edge); background: var(--paper); border-radius: 12px; }
.row { display: flex; align-items: center; gap: 10px; }
.row--between { justify-content: space-between; }
.done { display: grid; justify-items: center; gap: 8px; padding: 8px 0 0; text-align: center; }
.done .ico { width: 44px; height: 44px; }
.prog { height: 6px; border-radius: 3px; background: var(--line2); overflow: hidden; }
.prog i { display: block; height: 100%; width: 40%; background: var(--ink); animation: slide 1.4s var(--ease) infinite; }
[data-theme="bold"] .prog { height: 12px; border: 2px solid var(--edge); border-radius: 999px; background: var(--paper); }
[data-theme="bold"] .prog i { background: var(--t2); }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.code-row { display: flex; align-items: center; gap: 8px; }
.code-row .code { flex: 1; }
.menu { position: fixed; z-index: 45; min-width: 210px; padding: 6px; background: var(--raised); border: var(--bw) solid var(--line); border-radius: var(--r-card); animation: pop .16s var(--ease) both; }
[data-theme="ink"] .menu { box-shadow: var(--pop-s); }
[data-theme="bold"] .menu { box-shadow: var(--sh-m); border-radius: 14px; }
.menu button { display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: var(--r-btn); background: transparent; text-align: left; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
.menu hr { border: 0; border-top: 1px solid var(--line2); margin: 6px 4px; }
[data-theme="bold"] .menu hr { border-top: 2px solid var(--edge); }
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 70; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 32px); padding: 10px 14px; background: var(--ink); color: var(--raised); border-radius: var(--r-btn); font-weight: 500; animation: toast .24s var(--ease) both; }
[data-theme="bold"] .toast { background: var(--t2); color: #111; border: 2px solid var(--edge); border-radius: 999px; box-shadow: var(--sh-s); font-weight: 700; }
@keyframes toast { from { opacity: 0; transform: translate(-50%, 8px); } }
.feed { columns: 2 320px; column-gap: 16px; }
.note { break-inside: avoid; margin: 0 0 16px; padding: 16px 18px; display: grid; gap: 10px; }
[data-theme="ink"] .note { background-image: radial-gradient(var(--dot) .6px, transparent .6px); background-size: 4px 4px; }
.note p { margin: 0; font: 400 15px/23px var(--font); }
.note__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 400 12px/16px var(--mono); color: var(--ink3); }
.rooms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.empty { display: grid; justify-items: center; gap: 10px; padding: 48px 16px; text-align: center; }
.empty-art { height: 100%; display: grid; place-items: center; color: var(--ink3); }
.empty-art svg { width: 22px; height: 22px; }
/* A file itself fills its viewer; its format, not a generic card, leads. */
.dialog.fview { width: min(1080px, calc(100vw - 32px)); }
.fview .dialog__head h2 { display: grid; min-width: 0; }
.fview .dialog__head > .row { flex: none; }
.fview__name { overflow-wrap: anywhere; }
.fview__quiet { color: var(--ink3); font: 400 12px/18px var(--font); }
.fview .dialog__body { padding: 0; }
.fview__tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
.fview__facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; padding: 0 18px 12px; border-bottom: var(--bw) solid var(--line2); }
.fview__facts .kv { min-width: 0; padding: 10px 0; }
.fview__facts .kv:last-child { grid-column: 1 / -1; padding-top: 12px; border-top: 1px solid var(--line2); border-bottom: 0; }
.fview__photo { position: relative; display: grid; place-items: center; min-height: 380px; background: #141310; }
.fview__photo img { display: block; max-width: 100%; max-height: calc(100vh - 190px); object-fit: contain; }
.fview__photo--zoom { place-items: start; overflow: auto; cursor: zoom-out; }
.fview__photo--zoom img { width: 140%; max-width: none; max-height: none; }
.fview__media { display: grid; place-content: center; min-height: 380px; padding: 32px; }
.fview__media audio { width: min(560px, 100%); }
.fview__media--video { background: #141310; }
.fview__media video { display: block; width: 100%; max-height: calc(100vh - 190px); }
.fview__badge { position: absolute; left: 16px; bottom: 16px; padding: 5px 9px; border-radius: var(--r-btn); background: rgba(20,19,16,.82); color: #fcfcfb; font-size: 12px; }
.fview__note { max-width: 72ch; min-height: 320px; margin: 0 auto; padding: 36px clamp(20px, 5vw, 64px); }
.fview__note p { margin: 0 0 18px; font: 400 16px/26px var(--font); }
.fview__note h1 { margin: 0 0 16px; font: 600 30px/38px var(--display); letter-spacing: -.02em; }
.fview__note h2 { margin: 28px 0 10px; font: 600 19px/26px var(--display); }
.fview__note ul { display: grid; gap: 8px; margin: 0 0 20px; padding-left: 22px; font: 400 16px/25px var(--font); }
.fview__note blockquote { margin: 22px 0; padding: 2px 0 2px 18px; border-left: 1px solid var(--ink2); color: var(--ink2); font: 400 17px/27px var(--font); }
.fview__note table { width: 100%; margin: 16px 0 22px; border-collapse: collapse; font-size: 14px; }
.fview__note th, .fview__note td { padding: 9px 10px; border-bottom: 1px solid var(--line2); text-align: left; }
.fview__note th { color: var(--ink3); font: 500 11px/16px var(--mono); text-transform: uppercase; }
.fview__source { min-height: 320px; margin: 0; padding: 32px clamp(20px, 5vw, 64px); overflow: auto; color: var(--ink2); font: 400 13px/23px var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
.fview__table { max-height: calc(100vh - 220px); padding: 0 20px 20px; overflow: auto; }
.fview__table .minitable { width: 100%; font-size: 13px; }
.fview__table th { position: sticky; top: 0; z-index: 1; padding: 18px 12px 10px; background: var(--raised); color: var(--ink3); font: 500 11px/16px var(--mono); text-align: left; }
.fview__table td { padding: 13px 12px; border-bottom: 1px solid var(--line2); }
.fview__table .num { text-align: right; font-family: var(--mono); }
.fview__external { min-height: 360px; padding: 40px 20px; }
.fview__external .empty { max-width: 480px; margin: 0 auto; padding: 24px 16px; text-align: center; }
.fview__external .ico svg { width: 32px; height: 32px; }
.fview__external .btn { margin-top: 6px; }
.fview__save-note { margin: 0; color: var(--ink2); }
@media (max-width: 760px) {
  .fview .dialog__head { position: relative; align-items: flex-start; flex-wrap: wrap; gap: 10px; }
  .fview .dialog__head h2 { flex: 1 1 160px; padding-right: 32px; }
  .fview .dialog__head > .row { flex-wrap: wrap; width: 100%; min-width: 0; max-width: 100%; margin-left: 0; }
  .fview .dialog__head > .row > [data-close] { position: absolute; top: 12px; right: 12px; }
  .fview__tools { min-width: 0; }
  .fview__tools .seg { max-width: 100%; overflow-x: auto; }
  .fview__tools .btn { padding-left: 10px; padding-right: 10px; }
  .fview__facts { grid-template-columns: minmax(0, 1fr); }
  .fview__facts .kv:last-child { grid-column: 1; }
  .fview__note { padding-top: 26px; }
  .fview__note h1 { font-size: 26px; line-height: 33px; }
  .fview__external { min-height: 300px; padding: 20px 8px; }
}
.lightbox { display: grid; grid-template-columns: minmax(0, 1fr) 280px; width: min(1080px, calc(100vw - 32px)); max-height: calc(100vh - 48px); overflow: hidden; }
.lightbox__img { position: relative; display: grid; place-items: center; background: #141310; min-height: 380px; }
.lightbox__img img { max-width: 100%; max-height: calc(100vh - 48px); display: block; }
.lightbox__nav { position: absolute; top: 50%; transform: translateY(-50%); }
.lightbox__side { display: flex; flex-direction: column; min-width: 0; border-left: var(--bw) solid var(--line2); }
[data-theme="bold"] .lightbox__side { border-left: 2px solid var(--edge); }
.kv { display: grid; gap: 2px; padding: 12px 20px; border-bottom: 1px solid var(--line2); }
[data-theme="bold"] .kv { border-bottom: 2px solid var(--edge); }
.keygrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.keygrid span { padding: 10px 0; text-align: center; font: 500 14px/18px var(--mono); border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--sunk); }
[data-theme="bold"] .keygrid span { border: 2px solid var(--edge); background: var(--paper); border-radius: 10px; font-weight: 700; }
.qrwrap { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.qrwrap .qr { width: 168px; height: 168px; }
[data-theme="bold"] .qr { border: 2px solid var(--edge); box-shadow: var(--sh-s); border-radius: 12px; }
.steps-list { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.matrix th, .matrix td { padding-left: 10px; padding-right: 10px; }
.field .seg { justify-self: start; }
.matrix td.cell { cursor: pointer; font-size: 13px; }
.matrix td.cell:hover { background: var(--active); }
.matrix th.group { border-bottom: 0; padding-bottom: 0; }
.plug { padding: 16px; display: grid; gap: 10px; align-content: start; }
.plug__foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.envs button { display: flex; align-items: center; padding: 2px 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink2); }
.envs button.on { color: var(--ink); font-weight: 600; }
.welcome__foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; }
@media (max-width: 1100px) { .rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .lightbox { grid-template-columns: 1fr; overflow: auto; } .lightbox__side { border-left: 0; }
  .keygrid { grid-template-columns: repeat(4, minmax(0, 1fr)); } .opts--grid, .opts--tiles { grid-template-columns: 1fr; }
  .qrwrap { grid-template-columns: 1fr; justify-items: center; } .head { flex-wrap: wrap; align-items: flex-start; }
  [data-theme="ink"] .nav a.on::before { display: none; }
}

.sbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--line2); }
.sbar i { display: block; height: 100%; transform-origin: left; animation: grow .9s var(--ease) both; }
.sbar .s1, .swatch.s1 { background: var(--ink); }
.sbar .s2, .swatch.s2 { background: var(--ink3); }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
.swatch.s0 { background: var(--line2); }
[data-theme="bold"] .sbar { height: 14px; border: 2px solid var(--edge); border-radius: 999px; background: var(--paper); }
[data-theme="bold"] .sbar i { border-right: 2px solid var(--edge); }
[data-theme="bold"] .sbar .s1, [data-theme="bold"] .swatch.s1 { background: var(--t1); }
[data-theme="bold"] .sbar .s2, [data-theme="bold"] .swatch.s2 { background: var(--t4); }
[data-theme="bold"] .swatch { border: 2px solid var(--edge); width: 14px; height: 14px; }
[data-theme="bold"] .swatch.s0 { background: var(--paper); }
.still .sbar i { animation: none !important; }

/* ===================== Dark mode, and type for other scripts ===================== */
[data-theme="ink"][data-mode="dark"] {
  --bg: #121210; --raised: #1a1a17; --sunk: #232320;
  --ink: #edece7; --ink2: rgba(237,236,231,.70); --ink3: rgba(237,236,231,.54);
  --line: rgba(237,236,231,.16); --line2: rgba(237,236,231,.08);
  --signal: #ff6b81; --accent: #edece7; --on-accent: #121210;
  --hover: rgba(237,236,231,.05); --active: rgba(237,236,231,.09);
  --dot: rgba(237,236,231,.06); --track: rgba(237,236,231,.12); --scrim: rgba(0,0,0,.55); --pop: 0 24px 64px rgba(0,0,0,.5); --pop-s: 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}
[data-theme="ink"][data-mode="dark"] .toggle.on::after { background: var(--bg); }
[data-theme="bold"][data-mode="dark"] {
  --bg: #26231f; --raised: #322e28; --sunk: #2d2a25; --paper: #322e28;
  --ink: #f7f2e8; --ink2: #d6cfc2; --ink3: #ada595;
  --line: #0b0a09; --line2: #0b0a09; --edge: #0b0a09;
  --hover: #3a352e; --active: #453f37; --grid: rgba(0,0,0,.22); --off: #48423b; --bad-row: #5a2a26; --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}
[data-theme="bold"][data-mode="dark"] :is(.nav a.on, .seg button.on, .st--ok:not(.st--plain), .st--run:not(.st--plain), .st--bad:not(.st--plain), .tag, .delta, .nav__count, .ico.c1, .ico.c2, .ico.c3, .ico.c4, .ico.c5, .av, .cite, .hit mark, .ws__mark) { color: #111; }
[data-theme="bold"][data-mode="dark"] .opt.on .check::after { border-color: #111; }
[data-theme="bold"][data-mode="dark"] :is(.opt.on, .hit.on) { background: color-mix(in srgb, var(--t3) 22%, var(--raised)); }
[data-theme="bold"][data-mode="dark"] .paper { background: color-mix(in srgb, var(--t3) 18%, var(--raised)); }
[data-theme="bold"][data-mode="dark"] .art--table { background: color-mix(in srgb, var(--t2) 16%, var(--raised)); }
[data-theme="bold"][data-mode="dark"] .spark { background: color-mix(in srgb, var(--t4) 22%, var(--raised)); }
html:lang(ja) { --cjk: "Hiragino Sans", "Yu Gothic", "Noto Sans JP"; }
html:lang(ko) { --cjk: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR"; }
html:lang(zh-Hans) { --cjk: "PingFang SC", "Microsoft YaHei", "Noto Sans SC"; }
html:lang(zh-Hant) { --cjk: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC"; }
:is(html:lang(ja), html:lang(ko), html:lang(zh-Hans), html:lang(zh-Hant)) :is(.label, .pipe b) { letter-spacing: 0; }
.menu .menu__aside { margin-left: auto; padding-left: 20px; font-size: 12px; color: var(--ink3); }
.menu .menu__on { width: 26px; flex: none; display: inline-flex; justify-content: flex-end; margin-left: auto; }
.menu .menu__aside + .menu__on { margin-left: 0; }
.top__lang { gap: 6px; padding: 0 10px; }
.top__lang .lang-code { font-size: 12px; font-weight: 600; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
:is(html:lang(zh-Hans), html:lang(zh-Hant)) .top__lang .lang-code { letter-spacing: 0; }
.crumb > * { white-space: nowrap; }
.crumb .here { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.top__actions { flex: none; }
/* On a phone the top bar keeps only the current page's name. */
@media (max-width: 560px) { .crumb > :not(.here) { display: none; } }
.crumb__step { padding: 0; border: 0; background: none; font: inherit; color: var(--ink3); cursor: pointer; }
.crumb__step:hover { color: var(--ink); }
.card__body .row--between { flex-wrap: wrap; row-gap: 8px; }
.seg button { white-space: nowrap; }
@media (max-width: 760px) { .head > div { min-width: 0; max-width: 100%; } .head .seg { max-width: 100%; overflow-x: auto; } .cols-table .hide-s { display: none; } .fgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ===================== Theme switch (design tool, outside the app) ===================== */
.switch { position: fixed; right: 16px; bottom: 16px; z-index: 60; display: flex; gap: 4px; padding: 4px; background: #141310; border-radius: 999px; box-shadow: 0 8px 28px rgba(0,0,0,.25); font: 500 12px/1 -apple-system, system-ui, sans-serif; }
.switch button { height: 30px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #cfcfcf; cursor: pointer; }
.switch button.on { background: #fff; color: #141310; }
.switch span { align-self: center; padding: 0 8px 0 10px; color: #8a8a8a; }

@media (max-width: 1100px) { .grid4 { grid-template-columns: repeat(2, 1fr); } .dash > * { grid-column: span 12; } .catalog { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; } .side { position: static; height: auto; } .side__foot, .nav-group, .envs { display: none; }
  .side { min-width: 0; } .side .nav { display: flex; flex-wrap: wrap; gap: 4px; } .page, .top { padding-left: 16px; padding-right: 16px; }
  .grid3 { grid-template-columns: 1fr; } .fsubs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; } .fsubs .paper { padding: 10px 12px; gap: 4px; } .fsubs .paper q { font-size: 13px; line-height: 18px; } .fsubs .paper .more { display: none; } .hero { grid-template-columns: 1fr; } .pipe { grid-template-columns: repeat(4, 1fr); }
  .src { grid-template-columns: 34px 1fr auto; } .src .hide-s { display: none; } .facts { grid-template-columns: 1fr 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } }

const FILE_ICON = { photo: 'photo', note: 'note', csv: 'table', audio: 'activity', video: 'photo', svg: 'photo', psd: 'file', raw: 'photo', other: 'file' };
// The top crumb goes on into a folder viewed in place: each folder a way back up.
// On a phone it says only where one is, as on every page; Back goes up.
function folderCrumb(route, arg, child) {
  const c = route === 'collection' && C.find((x) => x.name === arg);
  if (!c || !c.inPlace) return `<span class="here ${route === 'collection' ? 'mono' : ''}">${esc(child)}</span>`;
  const path = S.fpath[c.name] || [];
  const parts = [child, ...path];
  return parts.map((n, i) => {
    const last = i === parts.length - 1;
    return last ? `<span class="here">${esc(n)}</span>` : `<button class="crumb__step faint" data-act="fcrumb" data-c="${c.name}" data-i="${i}">${esc(n)}</button><span class="sep">/</span>`;
  }).join('');
}
const newest = (node) => [...node.files.map((f) => f[3]), ...Object.values(node.folders).map(newest)].sort().pop() || '';
const holds = (node) => node.files.length + Object.keys(node.folders).length;
// Every file under a folder, the newest first: what its cover shows.
const under = (node) => [...node.files, ...Object.values(node.folders).flatMap(under)].sort((a, b) => (a[3] < b[3] ? 1 : -1));
// A folder within a folder is a collection of its own: its cover shows what it holds,
// the folder sign only beside its name.
function subArt(node) {
  const all = under(node);
  const photos = all.filter((f) => f[4]).slice(0, 3);
  if (photos.length) return `<div class="collage collage--${photos.length}">${photos.map((f) => `<img src="${PH[f[4]]}" alt="">`).join('')}</div>`;
  const notes = all.filter((f) => f[1] === 'note');
  if (notes.length) return `<div class="paper"><span class="label">${md(notes[0][3])}</span><q>${esc(notes[0][5] || notes[0][0])}</q>${notes.length > 1 ? `<span class="more faint mono" style="font-size:12px">+ ${cnt({ n: notes.length - 1, u: 'notes' })}</span>` : ''}</div>`;
  return `<div class="empty-art">${t('fv.empty')}</div>`;
}
function subHolds(node) {
  const all = under(node);
  const photos = all.filter((f) => f[1] === 'photo').length, notes = all.filter((f) => f[1] === 'note').length;
  return photos ? cnt({ n: photos, u: 'photos' }) : notes ? cnt({ n: notes, u: 'notes' }) : cnt({ n: all.length, u: 'items' });
}
function folderNode(c) {
  let node = TREES[c];
  for (const p of S.fpath[c] || []) node = node && node.folders[p];
  return node;
}
function orderedFolderFiles(c) {
  const keys = { name: (f) => f[0], changed: (f) => f[3], size: (f) => sizeBytes(f[2]), kind: (f) => t(`kind.${f[1]}`) };
  return sorted(folderNode(c)?.files || [], S.fsort, S.fdir, keys);
}
function folderView(c) {
  const node = folderNode(c.name);

  const keys = { name: (e) => e.n, changed: (e) => e.ch, size: (e) => (e.dir ? 0 : sizeBytes(e.s)), kind: (e) => (e.dir ? '' : t(`kind.${e.k}`)) };
  const dirs = sorted(Object.entries(node.folders).map(([n, f]) => ({ n, dir: true, kids: holds(f), ch: newest(f), node: f })), S.fsort === 'kind' || S.fsort === 'size' ? 'name' : S.fsort, S.fsort === 'kind' || S.fsort === 'size' ? 'asc' : S.fdir, keys);
  const files = orderedFolderFiles(c.name).map(([n, k, s, ch, ph, x]) => ({ n, k, s, ch, ph, x }));
  const open = (e) => `data-act="${e.dir ? 'fopen' : 'ffile'}" data-c="${c.name}" data-n="${esc(e.n)}"`;

  const subCover = (e) => `<button class="cover cover--sub" ${open(e)}><div class="cover__art">${subArt(e.node)}</div><div class="cover__cap"><div class="cover__line"><span class="cover__name cover__name--folder">${Is('folder', 14)}${esc(e.n)}</span></div><div class="cover__meta">${subHolds(e.node)} · ${md(e.ch)}</div></div></button>`;
  const fileArt = (e) => (e.ph ? `<span class="ftile__art"><img src="${PH[e.ph]}" alt=""></span>` : e.k === 'note' && e.x ? `<span class="ftile__art ftile__art--paper"><span>${esc(e.x)}</span></span>` : e.k === 'csv' && e.x ? `<span class="ftile__art ftile__art--rows"><table class="minitable">${e.x.map((r) => `<tr>${r.map((v) => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table></span>` : `<span class="ftile__art ftile__art--ico">${I(FILE_ICON[e.k])}</span>`);

  const rows = `<div class="card wrap"><table class="table cols-table"><thead><tr>${sortHead('fsort', 'name', S.fsort, S.fdir, t('sort.name'))}${sortHead('fsort', 'kind', S.fsort, S.fdir, t('sort.kind'), 'hide-s')}${sortHead('fsort', 'size', S.fsort, S.fdir, t('sort.size'), 'num')}${sortHead('fsort', 'changed', S.fsort, S.fdir, t('fv.modified'), 'hide-s')}</tr></thead>

  return `${head(esc(c.label), t('fv.browseNote'), `<button class="btn" data-act="fsortmenu" aria-haspopup="menu">${Is('sort', 15)}${t(`sort.${S.fsort}`)}</button>${viewSeg('fview', S.fview)}${c.stored === 'Local' ? `<button class="btn" data-act="importfiles" data-c="${c.name}">${Is('upload', 15)}${t('importFiles')}</button>` : ''}<button class="btn" data-act="share" data-c="${c.name}">${t('col.share')}</button>`, t('fv.label', { place: placeName(c.stored) }))}
  ${all.length ? (S.fview === 'list' ? rows : tiles) : `<div class="card empty" style="padding:28px 16px"><span class="muted">${t('fv.empty')}</span></div>`}`;
}

function partOf(c, D) {
  const tb = TABLES[c.name];
  if (D.part === 'all') return t('part.everything', { c: c.name });
  if (c.kind === 'table') return t('part.in', { what: t('nOf', { a: nf(tb.some), b: cnt(tb.total) }), c: c.name });
  if (c.kind === 'photos') return t('part.in', { what: t('nOf', { a: nf(c.name === 'lisbon-photos' ? 4 : 212), b: cnt(c.count) }), c: c.name });
  if (c.kind === 'notes') return D.tags.length ? t('part.tagged', { tags: H(lst(D.tags.map((x) => `#${x}`), 'disjunction')), c: c.name }) : null;
  return D.rooms.length ? t('part.in', { what: H(lst(D.rooms)), c: c.name }) : null;
}
function filterText(f) {
  const b = (v) => H(`<b>${esc(v)}</b>`);
  return f.op === 'isNot' ? t('filter.isNot', { col: f.col, v: b(f.vals[0]) }) : t('filter.isAny', { col: f.col, list: H(lst(f.vals.map((v) => H(`<b>${esc(v)}</b>`)), 'disjunction')) });
}
function partStep(c, D) {
  let k, more = '';
  if (c.kind === 'table') {
    const tb = TABLES[c.name];
    k = 'table';
    if (D.part === 'some') more = `<div class="field"><span class="label">${t('part.cols')}</span><div class="cols">${tb.cols.map((h) => `<span class="chip ${D.off.includes(h) ? 'off' : ''}" data-act="check" data-bind="off" data-val="${esc(h)}">${esc(h)}</span>`).join('')}</div></div>${tb.filter ? `<div class="field"><span class="label">${t('part.rows')}</span><div class="input" style="font-size:13px"><span>${filterText(tb.filter)}</span><span class="faint mono" style="margin-left:auto">${t('nOf', { a: nf(tb.some), b: cnt(tb.total) })}</span></div></div>` : ''}`;
  } else if (c.kind === 'photos') {
    k = 'photos';
    const lis = c.name === 'lisbon-photos';
    if (D.part === 'some') more = `<div class="field"><span class="label">${t('part.takenBetween')}</span><div class="input" style="font-size:13px"><span>${t('part.range', { a: H(`<b>${md(lis ? '2024-11-07' : '2025-10-29')}</b>`), b: H(`<b>${md(lis ? '2024-11-08' : '2025-11-02')}</b>`) })}</span><span class="faint mono" style="margin-left:auto">${t('nOf', { a: nf(lis ? 4 : 212), b: cnt(c.count) })}</span></div></div>`;
  } else if (c.kind === 'notes') {
    k = 'notes';
    if (D.part === 'some') more = `<div class="field"><span class="label">${t('part.tags')}</span><div class="cols">${['reading', 'lisbon', 'run', 'ideas', 'family', 'todo'].map((x) => `<span class="chip ${D.tags.includes(x) ? '' : 'off'}" data-act="check" data-bind="tags" data-val="${x}">#${x}</span>`).join('')}</div></div>`;
  } else {
    k = 'rooms';
    if (D.part === 'some') more = `<div class="field"><span class="label">${t('part.roomsLabel')}</span><div class="cols">${ROOMS.map((x) => `<span class="chip ${D.rooms.includes(x) ? '' : 'off'}" data-act="check" data-bind="rooms" data-val="${esc(x)}">${esc(x)}</span>`).join('')}</div></div>`;
  }
  return `<div class="opts">${opt('part', 'all', D.part, twoLine(t('part.all'), c.kind === 'table' ? t('part.allCols', { count: colCount(c) }) : colCount(c)))}${opt('part', 'some', D.part, twoLine(t(`part.some.${k}`), t(`part.some.${k}.sub`)))}</div>${more}`;
}

// Cloud drives: which one, then how it connects. Its desktop app's folder
// where the app is on this computer (nothing to register); signing in on
// its page where it has an API (an app of the owner's own, registered once).
const DRIVES = [
  { n: 'Google Drive', sync: null, api: 'google' },
  { n: 'Dropbox', sync: ['~/Dropbox', [1.2, 'TB']], api: 'dropbox' },
  { n: 'OneDrive', sync: ['~/OneDrive', [860, 'GB']], api: null },
  { n: 'iCloud Drive', sync: ['~/Library/Mobile Documents', [48, 'GB']], api: null },
];
const driveOf = (n) => DRIVES.find((d) => d.n === n) || DRIVES[0];
// Each drive by the name its maker gives it in the language in use.
const driveName = (n) => (n === 'Google Drive' ? t('ap.gdrive') : n === 'iCloud Drive' ? t('drive.icloud') : n);
const driveHow = (n, how) => { const d = driveOf(n); return d.sync && d.api ? (how || 'sync') : d.sync ? 'sync' : 'api'; };
const driveUnavailable = (n) => { const d = driveOf(n); return !d.sync && !d.api; };
const driveGo = (n, how) => (driveHow(n, how) === 'sync' ? t('addPlace') : driveOf(n).api === 'dropbox' ? t('ap.toDropbox') : t('ap.toGoogle'));
function driveForm(D, pickKey, howKey) {
  const name = D[pickKey] || DRIVES[0].n, d = driveOf(name), how = driveHow(name, D[howKey]);
  const list = `<div class="field"><span class="label">${t('ap.which')}</span><div class="input"><select aria-label="${t('ap.which')}" data-change="drivepick" data-bind="${pickKey}" style="width:100%;border:0;background:transparent;font:inherit;outline:0">${DRIVES.map((x) => `<option value="${esc(x.n)}" ${x.n === name ? 'selected' : ''}>${esc(driveName(x.n))}</option>`).join('')}</select></div></div>`;
  const ways = d.sync && d.api ? `<div class="field"><span class="label">${t('ap.how')}</span><div class="opts">${opt(howKey, 'sync', how, twoLine(t('ap.howSync'), t('ap.howSync.sub', { path: d.sync[0] })))}${opt(howKey, 'api', how, twoLine(t('ap.howApi'), t('ap.howApi.sub')))}</div></div>` : '';
  let body;
  if (how === 'sync') body = `<div class="box">${t('ap.syncKept', { path: `${d.sync[0]}/Oikome` })} ${t('ap.encrypted', { drive: esc(driveName(name)) })}</div>`;
  else if (driveUnavailable(name)) body = `<div class="box">${t(name === 'iCloud Drive' ? 'ap.icloudSetup' : 'ap.oneDriveSetup')}</div><button class="btn btn--quiet" data-act="drivecheck">${t('ap.checkAgain')}</button>`;
  else if (d.api === 'dropbox') body = `<p class="hint" style="margin:0 0 4px">${t('ap.dropboxSteps')}</p><ol class="hint" style="margin:0 0 10px;padding-left:20px"><li>${t('ap.dropboxStep1')}</li><li>${t('ap.dropboxStep2')}</li><li>${t('ap.dropboxStep3')}</li></ol><div class="field"><span class="label">${t('ap.appKey')}</span><div class="input"><input data-bind="user" value="${esc(D.user || '')}" autocomplete="off"></div></div><div class="box">${t('ap.dropboxNote')}</div>`;
  else body = GOOGLE_FORM(D, !!d.sync);
  return `${list}${ways}${body}`;
}
const GOOGLE_STEPS = ['https://console.cloud.google.com/projectcreate', 'https://console.cloud.google.com/apis/library/drive.googleapis.com', 'https://console.cloud.google.com/auth/overview', 'https://console.cloud.google.com/auth/clients/create'];

function hl(text, words) {
  const low = text.toLowerCase();
  let out = '', i = 0;
  while (i < text.length) {
    let best = -1, len = 0;
    for (const w of words) { const j = low.indexOf(w, i); if (j !== -1 && (best === -1 || j < best)) { best = j; len = w.length; } }
    if (best === -1) { out += esc(text.slice(i)); break; }
    out += esc(text.slice(i, best)) + '<mark>' + esc(text.slice(best, best + len)) + '</mark>';
    i = best + len;
  }
  return out;
}

  document.body.appendChild(el);

  el.style.left = Math.max(8, Math.min(r.right - w, window.innerWidth - w - 8)) + 'px';

    <nav class="nav">${NAV.map(([r, k, ic, n]) => `<a href="#${r}" class="${sec === r ? 'on' : ''}">${I(ic)}${t(k)}${n ? `<span class="nav__count">${n}</span>` : ''}</a>`).join('')}</nav>
    <div class="nav-group label">${t('places')}</div>
    <div class="envs" style="display:grid;gap:8px;padding:0 10px">${PLACES.map((p, i) => `<button class="${i === S.place ? 'on' : ''}" data-act="place" data-i="${i}">${glyph(p.name === 'iCloud Drive' ? 'idle' : 'ok', esc(placeName(p.name)))}</button>`).join('')}</div>
    <div class="side__foot"><nav class="nav"><a href="#settings" class="${route === 'settings' || route === 'place' ? 'on' : ''}">${I('settings')}${t('nav.settings')}</a></nav>
      <div class="meter-card" data-go="place/${slug(pl.name)}"><div class="meter-card__row"><span class="label">${esc(placeName(pl.name))}</span><span class="mono faint" style="font-size:11px">${pl.used ? `${sz(pl.used)} / ${sz(pl.total)}` : t('checking')}</span></div><div class="bar"><i style="width:${pl.p}%"></i></div></div>
      <div class="me">${av('Rosh', 'd')}<div><div class="me__name">${esc(S.dcName)}</div><div class="ws__sub">${plain('ok', t('running'))}</div></div></div></div>
  </aside>
  <main class="main"><div class="top"><div class="crumb"><span class="faint">rosh-mbp</span><span class="sep">/</span>${child ? `<a class="faint" href="#${sec}">${t(TITLES[route])}</a><span class="sep">/</span>${folderCrumb(route, arg, child)}` : `<span class="here">${t(TITLES[route])}</span>`}</div>
    <div class="top__actions"><button class="btn btn--ghost icon-btn" data-act="cmdk" title="${t('search')}" aria-label="${t('search')}">${I('search')}</button>${langBtn()}<button class="btn btn--ghost icon-btn" data-act="modemenu" title="${t('theme')}" aria-label="${t('theme')}: ${t(S.mode)}">${I(MODE_ICON[S.mode])}</button><a class="btn" href="#welcome">${t('firstRun')}</a></div></div>
    <div class="page" id="page">${inner}</div></main></div>`;
}
const root = document.getElementById('root');
function render(quiet) {
  closeMenu();
  const [route, raw] = (location.hash.slice(1) || 'home').split('/');
  const arg = raw ? decodeURIComponent(raw) : '';
  const r = screens[route] ? route : 'home';
  const y = window.scrollY;
  root.innerHTML = r === 'welcome' ? screens.welcome() : shell(r, arg, screens[r](arg));
  const th = document.documentElement.dataset.theme;
  document.querySelectorAll('[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === th));
  if (quiet) { root.querySelector('.page, .welcome')?.classList.add('still'); window.scrollTo(0, y); } else countUp();
}
function countUp() {
  document.querySelectorAll('[data-count]').forEach((el) => {
    const end = Number(el.dataset.count); const t0 = performance.now();
    const step = (now) => { const p = Math.min(1, (now - t0) / 700); el.textContent = nf(Math.round(end * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function setTheme(th) {
  document.documentElement.dataset.theme = th;
  try { localStorage.setItem('oikome-proto-theme', th); } catch {}
  document.querySelectorAll('[data-set]').forEach((b) => b.classList.toggle('on', b.dataset.set === th));
}
document.addEventListener('click', (e) => {
  if (MENU) {
    const b = e.target.closest('.menu [data-mi]');
    const it = b && MENU.items[+b.dataset.mi];
    closeMenu();
    if (it) it[2]();
    if (b || e.target.closest('.menu')) return;
  }
  const set = e.target.closest('[data-set]'); if (set) { setTheme(set.dataset.set); return; }
  const act = e.target.closest('[data-act]');
  if (act && !act.disabled && ACT[act.dataset.act]) { ACT[act.dataset.act](act, e); return; }
  if (e.target.matches('[data-close]') || e.target.closest('button[data-close]')) { close(); return; }
  const g = e.target.closest('[data-go]');
  if (g && !e.target.closest('a, button')) go(g.dataset.go);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (el && ACT[el.dataset.change]) ACT[el.dataset.change](el);
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'q' && D && D.name === 'cmdk') { D.q = el.value; D.sel = 0; layer.querySelector('#hits').innerHTML = hitsHTML(D); return; }
  if (el.dataset.bind && D) D[el.dataset.bind] = el.value;
  if (el.dataset.wbind) S[el.dataset.wbind] = el.value;
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); open('cmdk', { q: '', scope: '', sel: 0 }); return; }
  if (e.key === 'Escape') { if (MENU) closeMenu(); else if (D) close(); return; }
  if (!D) return;
  if (D.name === 'fview' && (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'a') {
    const content = layer.querySelector('.fview__source, .fview__note, .fview__table');
    if (content) {
      e.preventDefault();
      const range = document.createRange(); range.selectNodeContents(content);
      const selection = window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
    }
    return;
  }
  if (D.name === 'cmdk' && ['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) {
    e.preventDefault();
    if (e.key === 'Enter') { const h = HITS[D.sel]; if (h) { close(); if (h.go) go(h.go); else h.run(); } return; }
    D.sel = Math.max(0, Math.min(HITS.length - 1, D.sel + (e.key === 'ArrowDown' ? 1 : -1)));
    layer.querySelector('#hits').innerHTML = hitsHTML(D);
    layer.querySelector('.hit.on')?.scrollIntoView({ block: 'nearest' });
  }
  if (['photo', 'fview'].includes(D.name) && (e.key === 'ArrowLeft' || e.key === 'ArrowRight') && D.set.length > 1) {
    e.preventDefault();
    upd({ i: (D.i + (e.key === 'ArrowRight' ? 1 : -1) + D.set.length) % D.set.length });
  }
  if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.dataset.bind) layer.querySelector('.dialog__foot .btn--primary:not([disabled])')?.click();
});
window.addEventListener('hashchange', () => { D = null; drawLayer(); if (location.hash === '#welcome') S.welcome = 1; render(); window.scrollTo(0, 0); });
let saved = 'ink'; try { saved = localStorage.getItem('oikome-proto-theme') || 'ink'; } catch {}
const qStyle = new URLSearchParams(location.search).get('style'); if (qStyle === 'ink' || qStyle === 'bold') saved = qStyle;
setTheme(saved);
document.documentElement.lang = S.lang;
applyMode();
render();
setTheme(saved);
</script>
</body>
